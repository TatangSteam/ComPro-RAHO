name: Deploy ComPro-RAHO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'docker-compose.prod.yml'
      - 'backend/Dockerfile'
      - 'backend/entrypoint.sh'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/prisma/**'
      - 'backend/src/**'
      - 'backend/tsconfig*.json'
      - 'frontend/Dockerfile'
      - 'frontend/entrypoint.sh'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/public/**'
      - 'frontend/src/**'
      - 'frontend/next.config.*'
      - 'frontend/postcss.config.*'
      - 'frontend/tailwind.config.*'
      - 'frontend/tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Sync secret files
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          src="$HOME/ComPro-RAHO/secrets"
          dst="${GITHUB_WORKSPACE}/secrets"

          if [[ ! -d "$src" ]]; then
            echo "Missing local secrets directory: $src" >&2
            exit 1
          fi

          mkdir -p "$dst"
          cp -a "$src/." "$dst/"

      - name: Detect manifest changes
        id: manifest_changes
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"

          if printf '%s\n' "$changed_files" | grep -Eq '^(package\.json|package-lock\.json|backend/package\.json|backend/package-lock\.json|frontend/package\.json|frontend/package-lock\.json)$'; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync app lockfiles
        id: sync_lockfiles
        if: steps.manifest_changes.outputs.should_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          (cd backend && npm install --package-lock-only --ignore-scripts --no-workspaces)
          (cd frontend && npm install --package-lock-only --ignore-scripts --no-workspaces)

          if git diff --quiet -- backend/package-lock.json frontend/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          git commit -m "chore(ci): sync app lockfiles"
          git push origin HEAD:${GITHUB_REF_NAME}

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and deploy
        if: steps.sync_lockfiles.outputs.changed != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"
          exec 9>/tmp/raho-deploy.lock
          flock -x 9
          trap 'flock -u 9 || true' EXIT

          docker system prune -a -f
          if ! docker compose -f docker-compose.prod.yml build --pull backend frontend; then
            echo "Primary Docker Compose build failed, retrying with --no-cache..."
            docker compose -f docker-compose.prod.yml build --pull --no-cache backend frontend
          fi
          docker compose -f docker-compose.prod.yml run --rm migrate
          docker compose -f docker-compose.prod.yml up -d backend frontend
