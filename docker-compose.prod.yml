  # ── API (backend) — build immutable image, use secrets ─────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: raho-compro-api:latest
    container_name: raho-compro-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      MINIO_ENDPOINT: raho-minio
      MINIO_PORT: 9000
      MINIO_BUCKET: raho-uploads
      MINIO_PUBLIC_URL: http://raho-minio:9000
      MINIO_USE_SSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://rahopremier.id,http://38.147.122.167}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100
      AUTH_RATE_LIMIT_MAX: 10
    # depends_on:
    #   - postgres
    #   - minio
    secrets:
      - DATABASE_URL
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - JWT_ACCESS_SECRET
      - JWT_REFRESH_SECRET
    volumes:
      - ./frontend/public/assets:/usr/src/app/frontend/public/assets:ro
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 400M
    mem_limit: 400m
    cpus: "0.6"
    networks:
      - raho_network

  # ── Web (frontend) — build immutable image, use secrets ────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${WEB_NEXT_PUBLIC_API_URL:-https://rahopremier.id/api}
        NEXT_PUBLIC_APP_NAME: ${WEB_NEXT_PUBLIC_APP_NAME:-RAHO Klinik}
        NEXT_PUBLIC_APP_VERSION: ${WEB_NEXT_PUBLIC_APP_VERSION:-1.0.0}
    image: raho-compro-web:latest
    container_name: raho-compro-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${WEB_NEXT_PUBLIC_API_URL:-https://rahopremier.id/api}
      NEXT_PUBLIC_APP_NAME: ${WEB_NEXT_PUBLIC_APP_NAME:-RAHO Klinik}
      NEXT_PUBLIC_APP_VERSION: ${WEB_NEXT_PUBLIC_APP_VERSION:-1.0.0}
    depends_on:
      - backend
    secrets:
      - JWT_ACCESS_SECRET
      - JWT_REFRESH_SECRET
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 300M
    mem_limit: 300m
    cpus: "0.2"
    networks:
      - raho_network

  # ── One-off migration and seed tasks (run manually) ─────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: raho-compro-api:latest
    container_name: raho-compro-migrate
    restart: "no"
    # depends_on:
    #   - postgres
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      NODE_ENV: production
    secrets:
      - DATABASE_URL
      - POSTGRES_PASSWORD
    networks:
      - raho_network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: builder
    image: raho-compro-seed-builder:latest
    container_name: raho-compro-seed
    restart: "no"
    # depends_on:
    #   - postgres
    command: ["sh", "-c", "export DATABASE_URL=$(cat /run/secrets/DATABASE_URL) && export MINIO_ACCESS_KEY=$(cat /run/secrets/MINIO_ACCESS_KEY) && export MINIO_SECRET_KEY=$(cat /run/secrets/MINIO_SECRET_KEY) && npx prisma db seed"]
    environment:
      NODE_ENV: production
      MINIO_ENDPOINT: raho-minio
      MINIO_PORT: 9000
      MINIO_BUCKET: raho-uploads
      MINIO_PUBLIC_URL: http://raho-minio:9000
      MINIO_USE_SSL: "false"
    secrets:
      - DATABASE_URL
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
    volumes:
      - ./frontend/public/assets:/usr/src/app/frontend/public/assets:ro
    networks:
      - raho_network

# volumes:
#   raho_pgdata:
#     name: raho_pgdata
#   raho_miniodata:
#     name: raho_miniodata
#   npm_data:
#     name: raho_npm_data
#   npm_letsencrypt:
#     name: raho_npm_letsencrypt

networks:
  raho_network:
    external: true
    name: raho_network
    driver: bridge

secrets:
  DATABASE_URL:
    file: ./secrets/DATABASE_URL
  JWT_ACCESS_SECRET:
    file: ./secrets/JWT_ACCESS_SECRET
  JWT_REFRESH_SECRET:
    file: ./secrets/JWT_REFRESH_SECRET
  MINIO_ACCESS_KEY:
    file: ./secrets/MINIO_ACCESS_KEY
  MINIO_ROOT_PASSWORD:
    file: ./secrets/MINIO_ROOT_PASSWORD
  MINIO_ROOT_USER:
    file: ./secrets/MINIO_ROOT_USER
  MINIO_SECRET_KEY:
    file: ./secrets/MINIO_SECRET_KEY
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
